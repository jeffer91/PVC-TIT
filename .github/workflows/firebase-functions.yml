name: Desplegar backend PVC-TIT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar credenciales
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UTET }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT_UTET en GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UTET }}
      - name: Instalar dependencias
        run: npm install --prefix functions --no-audit --no-fund
      - name: Desplegar Firebase Function
        run: npx --yes firebase-tools@14 deploy --only functions:consultarFicha --project utet-4387a --non-interactive
